name: do_an
description: "Ứng dụng báo cáo đô thị sử dụng Google Maps API + Firebase."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2

  image_picker: ^1.1.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0
  http: ^1.2.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
